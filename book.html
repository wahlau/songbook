<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Songbook</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
  <script>try{var t=JSON.parse(localStorage.getItem('songbook.theme'));if(t)document.documentElement.dataset.theme=t;var f=JSON.parse(localStorage.getItem('songbook.font'));if(f)document.documentElement.style.setProperty('--lyric-size',f+'rem')}catch(e){}</script>
  <link rel="stylesheet" href="css/style.css?v=20261108c">
  <script src="config.js?v=20261108c"></script>
</head>
<body class="book">
  <header class="book-bar">
    <button id="tocBtn" class="icon-btn" type="button" aria-label="Contents and settings" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="bar-title">
      <span id="bookTitle">Songbook</span>
      <span id="pos" class="pos"></span>
    </div>
    <div class="bar-tools">
      <button id="fontDown" class="icon-btn" type="button" aria-label="Smaller text"><span class="a-small">A</span>−</button>
      <button id="fontUp" class="icon-btn" type="button" aria-label="Larger text"><span class="a-big">A</span>+</button>
      <button id="chordBtn" class="icon-btn" type="button" aria-pressed="true" hidden aria-label="Show chords" title="Chords on / off">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" fill="currentColor"/><circle cx="17" cy="16" r="3" fill="currentColor"/></svg>
        <span class="hide-xs">Chords</span>
      </button>
    </div>
  </header>

  <main id="song" class="song-view" tabindex="-1" aria-live="polite">
    <p class="status">Loading songbook…</p>
  </main>

  <nav class="pager" aria-label="Song navigation">
    <button id="prevBtn" type="button" disabled>
      <span class="arrow" aria-hidden="true">‹</span>
      <span class="pg-text"><small>Previous</small><span class="lbl"></span></span>
    </button>
    <button id="nextBtn" type="button" disabled>
      <span class="pg-text"><small>Next</small><span class="lbl"></span></span>
      <span class="arrow" aria-hidden="true">›</span>
    </button>
  </nav>

  <dialog id="drawer" class="drawer" aria-labelledby="drawerTitle">
    <div class="drawer-head">
      <h2 id="drawerTitle">Contents</h2>
      <button class="icon-btn" type="button" data-close aria-label="Close">✕</button>
    </div>
    <ol id="toc" class="toc"></ol>
    <div class="drawer-section">
      <label class="switch" id="awakeRow" hidden>
        <input type="checkbox" id="awake" checked>
        <span>Keep screen on</span>
      </label>
      <button id="themeBtn" class="drawer-btn" type="button">Light / dark theme</button>
      <button id="shareBtn" class="drawer-btn" type="button">Share this songbook</button>
      <button id="printBtn" class="drawer-btn" type="button">Print or save as PDF</button>
      <a id="editLink" class="drawer-btn" href="index.html">Edit songs in this book</a>
    </div>
    <p class="drawer-hint">Tip: swipe left or right, or use the ← → keys (works with most page-turner pedals), to change song.</p>
  </dialog>

  <div id="printAll" class="print-all" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/songs.js?v=20261108c"></script>
  <script src="js/common.js?v=20261108c"></script>
  <script src="js/book.js?v=20261108c"></script>
</body>
</html>
